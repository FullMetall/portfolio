services:
  portfolio:
    build:
      context: .
    image: fullmetall-portfolio:latest
    container_name: fullmetall-portfolio
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/case/lift-diagnostics-desktop.png",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web

networks:
  web:
    external: true
    name: lift-service_default