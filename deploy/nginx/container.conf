server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^(.+)/$ {
        absolute_redirect off;
        return 308 $1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}